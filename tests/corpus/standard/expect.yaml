# Как basic, но profile: standard (config.yaml): шаблон reference-standard.docx.
# template: требования к стилям docx (проверяются по styles.xml через python-docx).
contains:
- 1 Введение
- 2 Выкладки
- Определение 1.1
- Теорема 1.2
- Лемма 1.3
- Доказательство.
- Следует из (1.1) и леммы 1.3
- Формулы (2.1) и (2.2)
- Гипотеза.
- линейный код с порождающей
- "\t(1.1)"
- "\t(2.1)"
- "\t(2.2)"
- Рис. 1. Окружность
- "и леммы 1.3.\t◻"
not_contains:
- Proof.
- '[eq:'
- '"—'
- Гипотеза 1
math_min: 10
images_min: 1
styles:
- Theorem
- Definition
- Remark
- Proof
- Equation
report_absent:
- pandoc.math-as-text
- crossref.unresolved
- internal-error
- theorem.unlabeled
template:
  font: Times New Roman
  size_pt: 14
  line_spacing: 1.5
  space_after_pt: 0
  heading_color: '000000'
  first_line_indent_cm: 1.25
  justify: true
